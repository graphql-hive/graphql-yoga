name: notify-website

# The docs at the-guild.dev/graphql/yoga-server and the-guild.dev/graphql/envelop
# are built by the-guild-org/website, which fetches this repo's website/ and
# envelop-website/ folders (and the package changelogs) at build time. Tell it to redeploy whenever that
# content changes.
on:
  push:
    branches:
      - main
    paths:
      - website/**
      - envelop-website/**
      - packages/**/CHANGELOG.md
      # Plugin Hub pages render these readmes.
      - packages/envelop/**/README.md
      - packages/envelop/core/docs/*.md

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: trigger website rebuild
        env:
          # Fine-grained PAT for the-guild-org/website with contents:write
          # (repository_dispatch permission).
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/the-guild-org/website/dispatches \
            -d '{"event_type":"yoga-content-update"}'
